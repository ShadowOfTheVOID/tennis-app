name: ServeCoach
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  ServeAnalysis:
    path: .
targets:
  ServeCoach:
    type: application
    platform: iOS
    sources: [App/ServeCoach]
    dependencies:
      - package: ServeAnalysis
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Serve Coach
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Serve Coach uses the camera to track your body position while you serve.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Serve Coach analyzes serve videos you pick from your library.
